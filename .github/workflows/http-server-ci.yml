name: HTTP SERVER CI

on:
  workflow_dispatch:
  push:
    paths:
      - "http_server/**"
      - ".github/workflows/http-server-ci.yml"
  pull_request:
    paths:
      - "http_server/**"
      - ".github/workflows/http-server-ci.yml"

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare makefsdata
        run: |
          chmod +x http_server/makefsdata/makefsdata
          chmod +x http_server/make_fsdata.sh

      - name: Build STM32CubeIDE project (http_server)
        uses: xanderhendriks/action-build-stm32cubeide@v15.0
        with:
          project-path: 'http_server/http_server'
          project-target: 'http_server/Debug_CI'

      - name: Build Docker image (Dockerfile-fw)
        run: |
          docker build \
            -f http_server/Dockerfile \
            -t http-ci:fw \
            http_server

      - name: Create release firmware in container (py create_firmware.py)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/http_server:/workspace" \
            http-ci:fw

      - name: Upload firmware bin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: http-ci
          path: |
            http_server/scripts/*.bin

  create-release:
    runs-on: ubuntu-latest
    needs: [build]

    permissions: 
      contents: write

    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Debug artifacts
        uses: actions/download-artifact@v4
        with:
          name: http-ci
          path: collected/build

      - name: List received files
        run: |
          echo "=== collected ==="
          ls -R collected || true

      - name: Read firmware version from http_server/http_server/libs/version.h
        id: fwver
        run: |
          VERSION=$(grep -E '^#define[[:space:]]+FIRMWARE_VERSION[[:space:]]+"' \
          http_server/http_server/libs/version.h \
          | sed -E 's/.*"([^"]+)".*/\1/')

          if [ -z "$VERSION" ]; then
            echo "Cannot read FIRMWARE_VERSION from http_server/http_server/libs/version.h"
            exit 1
          fi

          echo "Firmware version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Read Device name from http_server/http_server/libs/version.h
        id: device
        run: |
          DEVICE=$(grep -E '^#define[[:space:]]+BIN_DEST_NAME[[:space:]]+"' \
          http_server/http_server/libs/version.h \
          | sed -E 's/.*"([^"]+)".*/\1/')

          if [ -z "$DEVICE" ]; then
            echo "Cannot read BIN_DEST_NAME from http_server/http_server/libs/version.h"
            exit 1
          fi

          echo "Device name: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Find generated firmware .bin
        id: bin-file
        run: |
          FILE=$(ls collected/build/*.bin)
          
          if [ -z "$FILE" ]; then
            echo "No .bin found in collected/build"
            ls -la collected/build || true
            exit 1
          fi
          
          echo "Found firmware file: $FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (bin + coverage)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.device.outputs.device }}_v${{ steps.fwver.outputs.version }}"
          name: "${{ steps.device.outputs.device }} v${{ steps.fwver.outputs.version }}"
          generate_release_notes: true
          files: |
            ${{ steps.bin-file.outputs.file }}



